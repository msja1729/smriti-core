[project]
name = "smriti"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "psycopg[binary]>=3.2",
  "langgraph>=1.0",
  "pyyaml>=6.0",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.8,<3.9",
  # The newest releases of these spaCy helpers crash loading en_core_web_sm
  # (OverflowError in Tokenizer._flush_specials); these versions work.
  "preshed==3.0.10",
  "murmurhash==1.0.13",
  "cymem==2.0.11",
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smriti = ["store/schema.sql", "bench/configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
